<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trabalho sOwl</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <main class="container py-5">
    <section class="section text-center">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
          <h1 class="title">Siga a sOwl e empodere-se</h1>
          <p class="description">
            A sOwl Digital conecta pessoas, ideias e oportunidades através de soluções
            digitais. Desenvolva a sua presença, acompanhe nossos conteúdos e fique por
            dentro de novidades que podem transformar sua jornada.
          </p>
        </div>
      </div>

      <div class="row justify-content-center align-items-center g-4 channel-content">
        <div class="col-12 col-sm-3 col-md-2">
          <div class="links d-flex flex-row flex-sm-column justify-content-center align-items-center gap-3">
            
            <a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook da Sowl">
              <img src="imagens/iconefacebook.png" alt="Facebook" class="icone img-fluid">
            </a>

            <a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram da Sowl">
              <img src="imagens/iconeinstagram.png" alt="Instagram" class="icone img-fluid">
            </a>

          </div>
        </div>

        <div class="col-12 col-sm-9 col-md-7 col-lg-6">
          <img src="imagens/principal.jpg" alt="" class="image img-fluid">
        </div>
      </div>
    </section>
  </main>

</body>
</html>
