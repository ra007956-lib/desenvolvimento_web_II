<meta charset="utf-8">
<script>
    const matematica = Number(prompt("Digite a nota de Matemática: "))
    const portugues = Number(prompt("Digite a nota de Português: "))
    const media = (matematica+portugues) / 2
    alert(`Nota de Matemática: ${matematica}.\nNota de Português: ${portugues}.\nMédia das notas: ${media}.`)
</script>
